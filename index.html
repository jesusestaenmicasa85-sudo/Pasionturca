<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PasiónTurcaTV - Catálogo Oficial</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0d0714;
            --card-bg: #1a0f28;
            --accent-color: #a855f7;
            --accent-hover: #9333ea;
            --text-color: #f3e8ff;
            --text-secondary: #c084fc;
            --danger: #ef4444;
            --success: #22c55e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding-bottom: 50px;
        }

        header {
            background: linear-gradient(180deg, rgba(26,15,40,0.95) 0%, rgba(13,7,20,0.8) 100%);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 100;
            padding: 15px 20px;
            border-bottom: 1px solid rgba(168, 85, 247, 0.2);
        }

        .header-title {
            font-size: 1.4rem;
            font-weight: 800;
            background: linear-gradient(90deg, #c084fc, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .search-container {
            margin-top: 12px;
        }

        .search-input {
            width: 100%;
            padding: 10px 15px;
            border-radius: 20px;
            border: 1px solid rgba(168, 85, 247, 0.3);
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            outline: none;
            font-size: 0.9rem;
        }

        .categories {
            display: flex;
            gap: 10px;
            padding: 15px 20px 5px;
            overflow-x: auto;
        }

        .category-tab {
            padding: 6px 14px;
            border-radius: 15px;
            background: rgba(168, 85, 247, 0.1);
            color: var(--text-secondary);
            font-size: 0.85rem;
            white-space: nowrap;
            cursor: pointer;
            border: 1px solid transparent;
        }

        .category-tab.active {
            background: var(--accent-color);
            color: #fff;
            font-weight: 600;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 15px;
            padding: 15px 20px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid rgba(168, 85, 247, 0.15);
            cursor: pointer;
            transition: transform 0.2s;
        }

        .card:active {
            transform: scale(0.97);
        }

        .card-img-container {
            width: 100%;
            height: 180px;
            background: #2a1b3d;
            position: relative;
        }

        .card-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .badge {
            position: absolute;
            top: 8px;
            right: 8px;
            padding: 3px 8px;
            border-radius: 8px;
            font-size: 0.65rem;
            font-weight: bold;
        }

        .badge-emision {
            background: var(--success);
            color: #fff;
        }

        .badge-finalizada {
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
        }

        .card-info {
            padding: 10px;
        }

        .card-title {
            font-size: 0.88rem;
            font-weight: 700;
            margin-bottom: 4px;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .card-subtitle {
            font-size: 0.72rem;
            color: var(--text-secondary);
        }

        /* Botón Flotante para Agregar Serie (+) */
        .fab-btn {
            position: fixed;
            bottom: 25px;
            right: 25px;
            width: 55px;
            height: 55px;
            background: var(--accent-color);
            color: #fff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            box-shadow: 0 4px 15px rgba(168, 85, 247, 0.4);
            cursor: pointer;
            z-index: 150;
            border: none;
            transition: transform 0.2s;
        }
        .fab-btn:active {
            transform: scale(0.9);
        }

        /* Modales */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            z-index: 200;
            display: none;
            justify-content: center;
            align-items: flex-end;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-content {
            background: var(--card-bg);
            width: 100%;
            max-height: 85vh;
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            padding: 20px;
            overflow-y: auto;
            border-top: 1px solid var(--accent-color);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .close-btn {
            background: none;
            border: none;
            color: #fff;
            font-size: 1.5rem;
            cursor: pointer;
        }

        .chapters-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 15px;
        }

        .chapter-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(168, 85, 247, 0.2);
            padding: 12px 15px;
            border-radius: 10px;
            color: #fff;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            font-size: 0.88rem;
        }

        .ad-countdown {
            text-align: center;
            padding: 12px;
            background: rgba(168, 85, 247, 0.1);
            border-radius: 10px;
            margin-bottom: 15px;
            border: 1px dashed var(--accent-color);
        }

        /* Formulario flotante */
        .form-group {
            margin-bottom: 12px;
        }
        .form-group label {
            display: block;
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-bottom: 5px;
        }
        .form-input, .form-select {
            width: 100%;
            padding: 10px;
            border-radius: 10px;
            border: 1px solid rgba(168, 85, 247, 0.3);
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            outline: none;
            font-size: 0.9rem;
        }
        .form-submit-btn {
            width: 100%;
            padding: 12px;
            background: var(--accent-color);
            color: #fff;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <header>
        <div class="header-title">
            <span>PasiónTurcaTV</span>
            <span style="font-size: 0.8rem; color: var(--text-secondary);" id="user-greeting">👋 ¡Hola!</span>
        </div>
        <div class="search-container">
            <input type="text" id="search" class="search-input" placeholder="Buscar serie..." onkeyup="filterSeries()">
        </div>
    </header>

    <div class="categories">
        <div class="category-tab active" onclick="setCategory('all', this)">Todas</div>
        <div class="category-tab" onclick="setCategory('emision', this)">En Emisión</div>
        <div class="category-tab" onclick="setCategory('finalizada', this)">Completadas</div>
    </div>

    <div class="grid" id="series-grid"></div>

    <!-- Botón flotante para agregar serie -->
    <button class="fab-btn" onclick="openAddModal()">+</button>

    <!-- Modal de Capítulos -->
    <div class="modal-overlay" id="modal">
        <div class="modal-content">
            <div class="modal-header">
                <div>
                    <h2 id="modal-title" style="font-size: 1.1rem; color: #fff;"></h2>
                    <span id="modal-subtitle" style="font-size: 0.78rem; color: var(--text-secondary);"></span>
                </div>
                <button class="close-btn" onclick="closeModal()">&times;</button>
            </div>

            <div id="ad-container" class="ad-countdown" style="display: none;">
                <p style="font-size: 0.8rem;">🍿 Redirigiendo al canal privado...</p>
            </div>

            <div class="chapters-list" id="chapters-container"></div>
        </div>
    </div>

    <!-- Modal para Agregar Nueva Serie -->
    <div class="modal-overlay" id="add-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 style="font-size: 1.1rem; color: #fff;">Agregar Nueva Serie</h2>
                <button class="close-btn" onclick="closeAddModal()">&times;</button>
            </div>
            <div class="form-group">
                <label>Título de la Serie / Temporada</label>
                <input type="text" id="new-title" class="form-input" placeholder="Ej: Nueva Serie T1">
            </div>
            <div class="form-group">
                <label>Estado</label>
                <select id="new-status" class="form-select">
                    <option value="emision">En Emisión</option>
                    <option value="finalizada">Completada</option>
                </select>
            </div>
            <div class="form-group">
                <label>Cantidad de Capítulos</label>
                <input type="number" id="new-episodes" class="form-input" value="1" min="1">
            </div>
            <div class="form-group">
                <label>Enlace de la Portada (Imagen)</label>
                <input type="text" id="new-image" class="form-input" placeholder="https://...">
            </div>
            <div class="form-group">
                <label>Enlace del Canal de Telegram</label>
                <input type="text" id="new-link" class="form-input" value="https://t.me/your_channel_link">
            </div>
            <button class="form-submit-btn" onclick="addNewSeries()">Guardar Serie</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.expand();
            if (tg.initDataUnsafe?.user) {
                document.getElementById('user-greeting').innerText = `👋 ${tg.initDataUnsafe.user.first_name}`;
            }
        }

        // Catálogo principal (puedes editar capítulos y estados aquí o agregarlas con el botón +)
        const seriesData = [
            { id: 'baskalarinin', title: 'Başkalarının Hayatı', status: 'emision', image: 'PON_AQUÍ_TU_ENLACE_DE_IMAGEN', episodes: 3, link: 'https://t.me/your_channel_link' },
            { id: 'tasacak2', title: 'Tusacak bu deniz T2', status: 'emision', image: 'PON_AQUÍ_TU_ENLACE_DE_IMAGEN', episodes: 2, link: 'https://t.me/your_channel_link' },
            { id: 'arafta2', title: 'ARAFTA T2', status: 'emision', image: 'PON_AQUÍ_TU_ENLACE_DE_IMAGEN', episodes: 26, link: 'https://t.me/your_channel_link' },
            { id: 'sevdigim2', title: 'Sevdigim sensin T2', status: 'emision', image: 'PON_AQUÍ_TU_ENLACE_DE_IMAGEN', episodes: 6, link: 'https://t.me/your_channel_link' },
            { id: 'muhtemel1', title: 'MUHTEMEL ASK T1', status: 'emision', image: 'PON_AQUÍ_TU_ENLACE_DE_IMAGEN', episodes: 18, link: 'https://t.me/your_channel_link' },
            { id: 'halef2', title: 'Halef T2', status: 'emision', image: 'PON_AQUÍ_TU_ENLACE_DE_IMAGEN', episodes: 4, link: 'https://t.me/your_channel_link' },
            { id: 'asktaht', title: 'Ask ve Taht', status: 'emision', image: 'PON_AQUÍ_TU_ENLACE_DE_IMAGEN', episodes: 5, link: 'https://t.me/your_channel_link' },
            { id: 'yeralti2', title: 'Yeralti T2', status: 'emision', image: 'PON_AQUÍ_TU_ENLACE_DE_IMAGEN', episodes: 2, link: 'https://t.me/your_channel_link' },
            { id: 'abi2', title: 'ABI T2', status: 'emision', image: 'PON_AQUÍ_TU_ENLACE_DE_IMAGEN', episodes: 5, link: 'https://t.me/your_channel_link' },
            { id: 'anneyarisi', title: 'Anne Yarisi', status: 'emision', image: 'PON_AQUÍ_TU_ENLACE_DE_IMAGEN', episodes: 4, link: 'https://t.me/your_channel_link' },
            { id: 'uzak', title: 'Uzak Şehir', status: 'emision', image: 'PON_AQUÍ_TU_ENLACE_DE_IMAGEN', episodes: 5, link: 'https://t.me/your_channel_link' },
            { id: 'sevdanates', title: 'Sevdan Bir Ates', status: 'emision', image: 'PON_AQUÍ_TU_ENLACE_DE_IMAGEN', episodes: 6, link: 'https://t.me/your_channel_link' },
            { id: 'tuzlukahve', title: 'Tuzlu Kahve', status: 'emision', image: 'PON_AQUÍ_TU_ENLACE_DE_IMAGEN', episodes: 7, link: 'https://t.me/your_channel_link' },
            { id: 'haysiyet', title: 'Haysiyet', status: 'emision', image: 'PON_AQUÍ_TU_ENLACE_DE_IMAGEN', episodes: 6, link: 'https://t.me/your_channel_link' },
            { id: 'evlilikguzel', title: 'Evlilik Guzeldir', status: 'emision', image: 'PON_AQUÍ_TU_ENLACE_DE_IMAGEN', episodes: 6, link: 'https://t.me/your_channel_link' },
            { id: 'daha17', title: 'DAHA17 T1', status: 'emision', image: 'PON_AQUÍ_TU_ENLACE_DE_IMAGEN', episodes: 20, link: 'https://t.me/your_channel_link' },
            { id: 'gullergunahlar', title: 'Guller ve Gunahlar T2', status: 'emision', image: 'PON_AQUÍ_TU_ENLACE_DE_IMAGEN', episodes: 5, link: 'https://t.me/your_channel_link' },
            { id: 'mercankosk', title: 'Mercan Kosk', status: 'emision', image: 'PON_AQUÍ_TU_ENLACE_DE_IMAGEN', episodes: 6, link: 'https://t.me/your_channel_link' },
            { id: 'doganin1', title: 'Doganin Kanunu T1', status: 'finalizada', image: 'PON_AQUÍ_TU_ENLACE_DE_IMAGEN', episodes: 13, link: 'https://t.me/your_channel_link' },
            { id: 'esrefruya1', title: 'ESREF RUYA T1', status: 'finalizada', image: 'PON_AQUÍ_TU_ENLACE_DE_IMAGEN', episodes: 13, link: 'https://t.me/your_channel_link' },
            { id: 'esrefruya2', title: 'ESREF RUYA T2', status: 'finalizada', image: 'PON_AQUÍ_TU_ENLACE_DE_IMAGEN', episodes: 34, link: 'https://t.me/your_channel_link' },
            { id: 'yeralti1', title: 'YERALTI T1', status: 'finalizada', image: 'PON_AQUÍ_TU_ENLACE_DE_IMAGEN', episodes: 16, link: 'https://t.me/your_channel_link' },
            { id: 'tasacak1', title: 'Tasacak Bu Deniz T1', status: 'finalizada', image: 'PON_AQUÍ_TU_ENLACE_DE_IMAGEN', episodes: 31, link: 'https://t.me/your_channel_link' },
            { id: 'halef1', title: 'Halef T1', status: 'finalizada', image: 'PON_AQUÍ_TU_ENLACE_DE_IMAGEN', episodes: 35, link: 'https://t.me/your_channel_link' },
            { id: 'sevdigin1', title: 'SEVDIGIN SENSIN T1', status: 'finalizada', image: 'PON_AQUÍ_TU_ENLACE_DE_IMAGEN', episodes: 15, link: 'https://t.me/your_channel_link' }
        ];

        let currentCategory = 'all';

        function renderSeries() {
            const grid = document.getElementById('series-grid');
            const searchQuery = document.getElementById('search').value.toLowerCase();
            grid.innerHTML = '';

            const filtered = seriesData.filter(s => {
                const matchesCat = currentCategory === 'all' || s.status === currentCategory;
                const matchesSearch = s.title.toLowerCase().includes(searchQuery);
                return matchesCat && matchesSearch;
            });

            filtered.forEach(s => {
                const badgeClass = s.status === 'emision' ? 'badge-emision' : 'badge-finalizada';
                const badgeText = s.status === 'emision' ? 'En Emisión' : 'Completada';

                grid.innerHTML += `
                    <div class="card" onclick="openSeries('${s.id}')">
                        <div class="card-img-container">
                            <img src="${s.image}" class="card-img" alt="${s.title}" onerror="this.src='https://images.unsplash.com/photo-1485846234645-a62644f84728?w=400&q=80'">
                            <span class="badge ${badgeClass}">${badgeText}</span>
                        </div>
                        <div class="card-info">
                            <div class="card-title">${s.title}</div>
                            <div class="card-subtitle">${s.episodes} Cap. disponibles</div>
                        </div>
                    </div>
                `;
            });
        }

        function setCategory(cat, element) {
            currentCategory = cat;
            document.querySelectorAll('.category-tab').forEach(t => t.classList.remove('active'));
            element.classList.add('active');
            renderSeries();
        }

        function filterSeries() {
            renderSeries();
        }

        function openSeries(id) {
            const serie = seriesData.find(s => s.id === id);
            if (!serie) return;

            document.getElementById('modal-title').innerText = serie.title;
            document.getElementById('modal-subtitle').innerText = `Capítulos disponibles: ${serie.episodes}`;
            
            const container = document.getElementById('chapters-container');
            container.innerHTML = '';

            for (let i = serie.episodes; i >= 1; i--) {
                container.innerHTML += `
                    <div class="chapter-btn" onclick="openChapter('${serie.link}', ${i})">
                        <span>Capítulo ${i}</span>
                        <span style="font-size: 0.8rem; color: var(--accent-color);">Abrir en Telegram ➔</span>
                    </div>
                `;
            }

            document.getElementById('modal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('modal').classList.remove('active');
            document.getElementById('ad-container').style.display = 'none';
        }

        function openAddModal() {
            document.getElementById('add-modal').classList.add('active');
        }

        function closeAddModal() {
            document.getElementById('add-modal').classList.remove('active');
        }

        function addNewSeries() {
            const title = document.getElementById('new-title').value.trim();
            const status = document.getElementById('new-status').value;
            const episodes = parseInt(document.getElementById('new-episodes').value) || 1;
            const image = document.getElementById('new-image').value.trim() || 'PON_AQUÍ_TU_ENLACE_DE_IMAGEN';
            const link = document.getElementById('new-link').value.trim() || 'https://t.me/your_channel_link';

            if (!title) {
                alert('Por favor, ingresa el título de la serie.');
                return;
            }

            const newId = 'serie_' + Date.now();
            seriesData.unshift({ id: newId, title, status, image, episodes, link });

            renderSeries();
            closeAddModal();

            // Limpiar campos
            document.getElementById('new-title').value = '';
            document.getElementById('new-episodes').value = '1';
            document.getElementById('new-image').value = '';
        }

        function openChapter(channelLink, episode) {
            const adContainer = document.getElementById('ad-container');
            adContainer.style.display = 'block';

            setTimeout(() => {
                adContainer.style.display = 'none';
                if (tg && tg.openTelegramLink) {
                    tg.openTelegramLink(channelLink);
                } else {
                    window.open(channelLink, '_blank');
                }
            }, 1200);
        }

        renderSeries();
    </script>
</body>
</html>
