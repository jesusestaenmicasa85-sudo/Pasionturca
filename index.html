<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PasiónTurcaTV - Trabzon Edition</title>

    <!-- Script Oficial de Telegram WebApp -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <!-- Script de Monetización Adsgram -->
    <script src="https://sad.adsgram.ai/js/sad.min.js"></script>

    <style>
        /* =========================================
           PALETA ALTO CONTRASTE - TRABZON VÍVIDO
           ========================================= */
        :root {
            --bg-color: #0b1326;                             /* Azul Marino Profundo con luz */
            --card-bg: #152238;                             /* Azul Piedra Saturado */
            --accent-color: #dc2626;                        /* Rojo Carmesí VÍVIDO Y BRILLANTE */
            --text-color: #ffffff;                          /* Blanco Puro */
            --text-secondary: #f59e0b;                      /* Dorado Latón VÍVIDO */
            --gold-bright: #fbbf24;                         /* Dorado Amarillo Radiante */
            --success: #10b981;                             /* Verde Esmeralda Vívido */
            --gold-border: #f59e0b;                         /* Borde Dorado Sólido */
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        
        /* Fondo con vida y degradado visible */
        body { 
            background: linear-gradient(180deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%); 
            color: var(--text-color); 
            padding-bottom: 50px; 
            min-height: 100vh;
        }
        
        /* Header con Marco Dorado Reluciente */
        header { 
            background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%); 
            position: sticky; 
            top: 0; 
            z-index: 100; 
            padding: 15px 20px; 
            border-bottom: 3px solid var(--gold-bright); 
            box-shadow: 0 4px 25px rgba(220, 38, 38, 0.4);
        }
        
        .header-title { 
            font-size: 1.5rem; 
            font-weight: 900; 
            color: var(--gold-bright);
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            text-shadow: 0 2px 10px rgba(251, 191, 36, 0.3);
        }
        
        /* Indicador Usuarios En Línea */
        .active-users-pill { 
            font-size: 0.8rem; 
            color: #ffffff; 
            background: #059669; 
            border: 1.5px solid #34d399; 
            padding: 5px 12px; 
            border-radius: 14px; 
            display: flex; 
            align-items: center; 
            gap: 6px; 
            font-weight: 800; 
            box-shadow: 0 0 10px rgba(52, 211, 153, 0.4);
        }
        .pulse-dot { 
            width: 9px; 
            height: 9px; 
            background-color: #ffffff; 
            border-radius: 50%; 
            animation: pulse 1.5s infinite; 
        }
        @keyframes pulse {
            0% { transform: scale(0.8); opacity: 0.6; }
            50% { transform: scale(1.2); opacity: 1; }
            100% { transform: scale(0.8); opacity: 0.6; }
        }

        /* Buscador Vívido */
        .search-container { margin-top: 14px; }
        .search-input { 
            width: 100%; 
            padding: 12px 18px; 
            border-radius: 25px; 
            border: 2px solid var(--gold-bright); 
            background: #1e293b; 
            color: #fff; 
            outline: none; 
            font-size: 0.95rem;
            font-weight: 600;
            box-shadow: 0 0 12px rgba(245, 158, 11, 0.25);
        }
        .search-input:focus { 
            border-color: #ffffff; 
            box-shadow: 0 0 18px rgba(251, 191, 36, 0.6); 
        }

        /* Pestañas de Categoría VÍVIDAS */
        .categories { display: flex; gap: 10px; padding: 15px 20px 10px; overflow-x: auto; }
        .category-tab { 
            padding: 9px 18px; 
            border-radius: 20px; 
            background: #1e293b; 
            color: var(--gold-bright); 
            font-size: 0.9rem; 
            font-weight: 800;
            white-space: nowrap; 
            cursor: pointer; 
            border: 2px solid var(--gold-border); 
            transition: all 0.2s;
        }
        .category-tab.active { 
            background: linear-gradient(135deg, #dc2626 0%, #b91c1c 100%); 
            color: #ffffff; 
            border: 2px solid #ffffff; 
            box-shadow: 0 4px 15px rgba(220, 38, 38, 0.7);
        }

        /* Tarjetas de Series de Alto Impacto */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(145px, 1fr)); gap: 16px; padding: 15px 20px; }
        .card { 
            background: var(--card-bg); 
            border-radius: 14px; 
            overflow: hidden; 
            border: 2px solid var(--gold-bright); 
            cursor: pointer; 
            transition: transform 0.2s, box-shadow 0.2s; 
            box-shadow: 0 6px 18px rgba(0,0,0,0.6);
        }
        .card:hover, .card:active { 
            transform: translateY(-4px) scale(1.02); 
            border-color: #ffffff;
            box-shadow: 0 8px 25px rgba(245, 158, 11, 0.5);
        }
        
        .card-img-container { 
            width: 100%; 
            height: 195px; 
            position: relative; 
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding: 10px;
            box-sizing: border-box;
            background-size: cover;
            background-position: center;
            box-shadow: inset 0 -50px 25px rgba(15, 23, 42, 0.9);
        }

        /* Badges Vívidos */
        .badge { position: absolute; top: 8px; right: 8px; padding: 4px 10px; border-radius: 10px; font-size: 0.7rem; font-weight: 900; z-index: 2; }
        .badge-emision { background: #10b981; color: #ffffff; border: 1px solid #ffffff; box-shadow: 0 2px 10px rgba(16, 185, 129, 0.6); }
        .badge-finalizada { background: #64748b; color: #ffffff; border: 1px solid #ffffff; }
        
        .card-info { padding: 12px; background: #0f172a; }
        .card-title { font-size: 0.92rem; font-weight: 800; margin-bottom: 4px; color: #ffffff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .card-subtitle { font-size: 0.78rem; color: var(--gold-bright); font-weight: 700; }
        
        /* Zona Fan Vívida (Encuestas) */
        .fan-zone-container { padding: 20px; max-width: 600px; margin: 0 auto; display: none; }
        .fan-zone-card { 
            background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%); 
            border: 3px solid var(--gold-bright); 
            border-radius: 18px; 
            padding: 22px; 
            box-shadow: 0 8px 30px rgba(220, 38, 38, 0.4); 
        }
        .fan-zone-title { font-size: 1.3rem; font-weight: 900; color: var(--gold-bright); margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }
        .fan-zone-subtitle { font-size: 0.95rem; color: #ffffff; margin-bottom: 22px; line-height: 1.4; font-weight: 700; }
        
        .poll-option { 
            background: #1e293b; 
            border: 2px solid var(--gold-bright); 
            padding: 15px 18px; 
            border-radius: 14px; 
            margin-bottom: 14px; 
            color: #fff; 
            cursor: pointer; 
            transition: all 0.25s; 
            font-size: 1rem; 
            font-weight: 800;
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
        }
        .poll-option:hover { 
            background: rgba(245, 158, 11, 0.25); 
            border-color: #ffffff; 
        }
        .poll-option.selected { 
            background: linear-gradient(135deg, #dc2626 0%, #991b1b 100%); 
            color: #ffffff; 
            border-color: #ffffff; 
            box-shadow: 0 4px 18px rgba(220, 38, 38, 0.7);
        }

        /* Botón Flotante Admin (+ ) */
        .fab-btn { 
            position: fixed; 
            bottom: 25px; 
            right: 25px; 
            width: 60px; 
            height: 60px; 
            background: linear-gradient(135deg, #dc2626 0%, #991b1b 100%); 
            color: #fff; 
            border-radius: 50%; 
            display: none; 
            align-items: center; 
            justify-content: center; 
            font-size: 2.4rem; 
            box-shadow: 0 6px 20px rgba(220, 38, 38, 0.8); 
            cursor: pointer; 
            z-index: 150; 
            border: 2px solid #ffffff; 
        }
        
        /* Modal de Capítulos */
        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(10px); z-index: 200; display: none; justify-content: center; align-items: flex-end; }
        .modal-overlay.active { display: flex; }
        .modal-content { 
            background: #0f172a; 
            width: 100%; 
            max-height: 85vh; 
            border-top-left-radius: 24px; 
            border-top-right-radius: 24px; 
            padding: 20px; 
            overflow-y: auto; 
            border-top: 4px solid var(--gold-bright); 
            box-shadow: 0 -10px 35px rgba(220, 38, 38, 0.4);
        }
        
        .modal-banner { 
            width: 100%; 
            height: 160px; 
            border-radius: 14px; 
            background-size: cover; 
            background-position: center; 
            margin-bottom: 15px; 
            border: 2px solid var(--gold-bright); 
            box-shadow: 0 6px 18px rgba(0,0,0,0.7); 
            position: relative; 
        }
        .modal-banner-overlay { 
            position: absolute; 
            inset: 0; 
            background: linear-gradient(180deg, transparent 30%, rgba(15, 23, 42, 0.95) 100%); 
            border-radius: 14px; 
            display: flex; 
            align-items: flex-end; 
            padding: 14px; 
        }
        .modal-banner-title { color: #ffffff; font-size: 1.3rem; font-weight: 900; }

        /* Tarjetas de Episodios con Botón Rojo Vívido */
        .chapters-list { display: flex; flex-direction: column; gap: 12px; margin-top: 10px; }
        .episode-card { 
            background: #1e293b; 
            border: 2px solid var(--gold-bright); 
            border-radius: 14px; 
            padding: 12px 16px; 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            cursor: pointer; 
            transition: all 0.2s; 
        }
        .episode-card:active { transform: scale(0.98); background: rgba(245, 158, 11, 0.2); }
        
        .episode-info-container { display: flex; align-items: center; gap: 14px; }
        .episode-thumbnail { width: 50px; height: 50px; border-radius: 10px; background-size: cover; background-position: center; border: 2px solid var(--gold-bright); }
        .episode-title { color: #ffffff; font-size: 0.98rem; font-weight: 900; }
        .episode-subtitle { color: var(--gold-bright); font-size: 0.8rem; font-weight: 700; }

        .ver-now-btn { 
            background: linear-gradient(135deg, #dc2626 0%, #b91c1c 100%); 
            color: #ffffff; 
            border-radius: 18px; 
            padding: 8px 18px; 
            font-size: 0.82rem; 
            font-weight: 900; 
            text-transform: uppercase; 
            border: 1.5px solid #ffffff; 
            box-shadow: 0 4px 12px rgba(220, 38, 38, 0.5);
        }

        .close-btn { background: none; border: none; color: #fff; font-size: 1.8rem; cursor: pointer; font-weight: bold; }
        .ad-countdown { text-align: center; padding: 12px; background: rgba(245, 158, 11, 0.2); border-radius: 12px; margin-bottom: 15px; border: 2px dashed var(--gold-bright); color: var(--gold-bright); font-weight: 800; }
        
        .form-group { margin-bottom: 14px; }
        .form-group label { display: block; font-size: 0.85rem; color: var(--gold-bright); margin-bottom: 6px; font-weight: 800; }
        .form-input, .form-select { width: 100%; padding: 12px; border-radius: 12px; border: 2px solid var(--gold-bright); background: #1e293b; color: #fff; outline: none; font-size: 0.95rem; font-weight: 600; }
        .form-submit-btn { width: 100%; padding: 14px; background: linear-gradient(135deg, #dc2626 0%, #b91c1c 100%); color: #fff; border: 2px solid #ffffff; border-radius: 12px; font-weight: 900; cursor: pointer; margin-top: 10px; font-size: 1rem; }
    </style>
</head>
<body>
    <header>
        <div class="header-title">
            <span>PasiónTurcaTV</span>
            <div style="display: flex; align-items: center; gap: 10px;">
                <div class="active-users-pill" title="Usuarios activos ahora mismo">
                    <div class="pulse-dot"></div>
                    <span id="active-count">620</span> en línea
                </div>
                <span style="font-size: 0.85rem; color: #ffffff;" id="user-greeting">👋 ¡Hola!</span>
            </div>
        </div>
        <div class="search-container" id="search-box-container">
            <input type="text" id="search" class="search-input" placeholder="Buscar serie..." onkeyup="filterSeries()">
        </div>
    </header>

    <div class="categories">
        <div class="category-tab active" onclick="setCategory('all', this)">Todas</div>
        <div class="category-tab" onclick="setCategory('emision', this)">En Emisión</div>
        <div class="category-tab" onclick="setCategory('finalizada', this)">Completadas</div>
        <div class="category-tab" onclick="setCategory('fanzone', this)">Zona Fan ⭐</div>
    </div>

    <!-- Contenedor del Catálogo de Series -->
    <div class="grid" id="series-grid"></div>

    <!-- Contenedor de la Zona Fan Interactiva -->
    <div class="fan-zone-container" id="fanzone-container">
        <div class="fan-zone-card" id="fanzone-content">
            <!-- Contenido inyectado dinámicamente -->
        </div>
    </div>
    
    <button class="fab-btn" id="admin-fab" onclick="openAddModal()">+</button>

    <!-- Modal de Episodios Rediseñado -->
    <div class="modal-overlay" id="modal">
        <div class="modal-content">
            <!-- Banner Visual de la Serie -->
            <div class="modal-banner" id="modal-banner-bg">
                <div class="modal-banner-overlay">
                    <div class="modal-banner-title" id="modal-title"></div>
                </div>
            </div>
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
                <span id="modal-subtitle" style="font-size: 0.85rem; color: #fbbf24; font-weight:800;"></span>
                <button class="close-btn" onclick="closeModal()">&times;</button>
            </div>
            <div id="ad-container" class="ad-countdown" style="display: none;">
                <p style="font-size: 0.85rem;">🍿 Cargando anuncio...</p>
            </div>
            <div class="chapters-list" id="chapters-container"></div>
        </div>
    </div>

    <!-- Modal Admin Agregar Serie -->
    <div class="modal-overlay" id="add-modal">
        <div class="modal-content">
            <div class="modal-header" style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
                <h2 style="font-size: 1.1rem; color: #fff;">Agregar Nueva Serie Oficial</h2>
                <button class="close-btn" onclick="closeAddModal()">&times;</button>
            </div>
            <div class="form-group"><label>Título</label><input type="text" id="new-title" class="form-input"></div>
            <div class="form-group"><label>Estado</label><select id="new-status" class="form-select"><option value="emision">En Emisión</option><option value="finalizada">Completada</option></select></div>
            <div class="form-group"><label>Capítulos</label><input type="number" id="new-episodes" class="form-input" value="1"></div>
            <div class="form-group"><label>Enlace Telegram</label><input type="text" id="new-link" class="form-input" placeholder="https://t.me/..."></div>
            <div class="form-group"><label>URL Poster / Imagen</label><input type="text" id="new-poster" class="form-input" placeholder="https://..."></div>
            <button class="form-submit-btn" onclick="addNewSeries()">Guardar Serie</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram?.WebApp;
        const ADMIN_USER_ID = 0;

        const AdController = window.Adsgram ? window.Adsgram.init({ blockId: "54665" }) : null;

        if (tg) {
            tg.expand();
            if (tg.initDataUnsafe?.user) {
                const user = tg.initDataUnsafe.user;
                document.getElementById('user-greeting').innerText = `👋 ${user.first_name}`;
                if (ADMIN_USER_ID === 0 || user.id === ADMIN_USER_ID) {
                    document.getElementById('admin-fab').style.display = 'flex';
                }
            }
        }

        let currentUsers = Math.floor(Math.random() * (950 - 450 + 1)) + 450;
        function updateActiveUsers() {
            const countSpan = document.getElementById('active-count');
            if (countSpan) {
                let change = Math.floor(Math.random() * 25) - 12; 
                currentUsers = Math.max(380, Math.min(1100, currentUsers + change));
                countSpan.innerText = currentUsers >= 1000 ? (currentUsers / 1000).toFixed(1) + 'k' : currentUsers;
            }
        }
        setInterval(updateActiveUsers, 4000);

        const baseUrl = "https://jesusestaenmicasa85-sudo.github.io/Pasionturca/series/";

        const seriesData = [
            { id: 'gunesindogduguyor', title: 'Güneşin Doğduğu Yer', status: 'emision', episodes: 6, link: 'https://t.me/+abyIRQIqnYw5NDEx', poster: baseUrl + 'GunesinDogduguYer.jpg' },
            { id: 'ayniyagmuraltinda', title: 'Aynı yağmur altında', status: 'finalizada', episodes: 7, link: 'https://t.me/+RO-tOt9joNUyNjgx', poster: baseUrl + 'ayniyagmuraltinda.jpg' },
            { id: 'altiustuistanbul', title: 'Altı Üstü İstanbul', status: 'emision', episodes: 17, link: 'https://t.me/+', poster: baseUrl + 'altiustuistambul1.jpg' },
            { id: 'sevdamkaradeniz', title: 'Sevdam Karadeniz', status: 'emision', episodes: 2, link: 'https://t.me/+', poster: baseUrl + 'sevdamkaradeniz.jpg' },
            { id: 'baskalarininhayati', title: 'Başkalarının Hayatı', status: 'emision', episodes: 4, link: 'https://t.me/+EyUPG22tFMBjNjg5', poster: baseUrl + 'baskalarininhayati.jpg' },
            { id: 'tasacakbudeniz2', title: 'Tusacak bu deniz T2', status: 'emision', episodes: 3, link: 'https://t.me/+lEYenuKLJztkNjBh', poster: baseUrl + 'tasacakbudeniz2.jpg' },
            { id: 'arafta2', title: 'ARAFTA T2', status: 'emision', episodes: 29, link: 'https://t.me/+pLxw4RXS9vE0YTc5', poster: baseUrl + 'arafta2.jpg' },
            { id: 'sevdigimsensin2', title: 'Sevdigim sensin T2', status: 'emision', episodes: 7, link: 'https://t.me/+nZ1OxjeKFJc0Nzcx', poster: baseUrl + 'sevdigimsensin2.jpg' },
            { id: 'muhtemel1', title: 'MUHTEMEL ASK T1', status: 'emision', episodes: 19, link: 'https://t.me/+lKj8tnDm2i4zZTZh', poster: baseUrl + 'muhtemelask.jpg' },
            { id: 'halef2', title: 'Halef T2', status: 'emision', episodes: 5, link: 'https://t.me/+3wQxoBw6VzVjYWQ5', poster: baseUrl + 'halef2.jpg' },
            { id: 'asktaht', title: 'Ask ve Taht', status: 'finalizada', episodes: 5, link: 'https://t.me/+fsxUvsmHVYhhNTA5', poster: baseUrl + 'askvetaht.jpg' },
            { id: 'yeralti2', title: 'Yeralti T2', status: 'emision', episodes: 3, link: 'https://t.me/+pi35KULn2tthNDIx', poster: baseUrl + 'yeralti2.jpg' },
            { id: 'abi2', title: 'ABI T2', status: 'finalizada', episodes: 5, link: 'https://t.me/+oRSGcPqWYjI5NTAx', poster: baseUrl + 'abi.jpg' },
            { id: 'anneyarisi', title: 'Anne Yarisi', status: 'emision', episodes: 5, link: 'https://t.me/+q94zhfhkhsgwNDRh', poster: baseUrl + 'anneyarisi.jpg' },
            { id: 'uzaksehir', title: 'Uzak Şehir T3', status: 'emision', episodes: 5, link: 'https://t.me/+H7k3D6FAwug2MGYx', poster: baseUrl + 'uzaksehir3.jpg' },
            { id: 'sevdanbirates1', title: 'Sevdan Bir Ates', status: 'emision', episodes: 7, link: 'https://t.me/+XBHRFHhky2MxZWI5', poster: baseUrl + 'sevdanbirates1.jpg' },
            { id: 'tuzlukahve', title: 'Tuzlu Kahve', status: 'emision', episodes: 8, link: 'https://t.me/+c9wQ6VzuF-NkZDFh', poster: baseUrl + 'tuzlukahve.jpg' },
            { id: 'haysiyet', title: 'Haysiyet', status: 'emision', episodes: 6, link: 'https://t.me/+k0r7HsX3zPdjYWEx', poster: baseUrl + 'haysiyet.jpg' },
            { id: 'evlilikguzel', title: 'Evlilik Guzeldir', status: 'emision', episodes: 6, link: 'https://t.me/+kgExQ8EUDdgyMzZh', poster: baseUrl + 'evelikguzeldir.jpg' },
            { id: 'daha17', title: 'DAHA17 T1', status: 'emision', episodes: 20, link: 'https://t.me/+8byaYGNbIDpmMTY5', poster: baseUrl + 'daha17.jpg' },
            { id: 'gullergunahlar', title: 'Guller ve Gunahlar T2', status: 'emision', episodes: 6, link: 'https://t.me/+sgrRg_6eJokzYjJh', poster: baseUrl + 'gullervegunahlar2.jpg' },
            { id: 'mercankosk', title: 'Mercan Kosk', status: 'finalizada', episodes: 7, link: 'https://t.me/+SgkFOzeAQk0yNTZh', poster: baseUrl + 'mercankosk.jpg' },
            { id: 'doganinkanunu', title: 'Doganin Kanunu T1', status: 'finalizada', episodes: 13, link: 'https://t.me/+YhgLoH6sie45NDMx', poster: baseUrl + 'doganinkanunu.jpg' },
            { id: 'esrefruya1', title: 'ESREF RUYA T1', status: 'finalizada', episodes: 13, link: 'https://t.me/+TDV2r4oXvd8yYjA5', poster: baseUrl + 'esrefruya1.jpg' },
            { id: 'esrefruya2', title: 'ESREF RUYA T2', status: 'finalizada', episodes: 34, link: 'https://t.me/+QCxp935kiVVhNzQx', poster: baseUrl + 'esrefruya2.jpg' },
            { id: 'halef1', title: 'Halef T1', status: 'finalizada', episodes: 35, link: 'https://t.me/+plbLK3zPUuNlYTZh', poster: baseUrl + 'halef1.jpg' },
            { id: 'tasacakbudeniz', title: 'Tasacak Bu Deniz T1', status: 'finalizada', episodes: 31, link: 'https://t.me/+KqZmk_32HQ1lMmMx', poster: baseUrl + 'tasacakbudeniz1.jpg' },
            { id: 'yeralti', title: 'YERALTI T1', status: 'finalizada', episodes: 16, link: 'https://t.me/+1QlrMYUwhCViMGUx', poster: baseUrl + 'yeralti1.jpg' },
            { id: 'sevdiginsensin1', title: 'SEVDIGIN SENSIN T1', status: 'finalizada', episodes: 15, link: 'https://t.me/+LlXBxpfADgxkYzgx', poster: baseUrl + 'sevdigimsensin1.jpg' }
        ];

        let currentCategory = 'all';

        function renderSeries() {
            const grid = document.getElementById('series-grid');
            const searchQuery = document.getElementById('search').value.toLowerCase();
            grid.innerHTML = '';

            const filtered = seriesData.filter(s => {
                const matchesCat = currentCategory === 'all' || s.status === currentCategory;
                const matchesSearch = s.title.toLowerCase().includes(searchQuery);
                return matchesCat && matchesSearch;
            });

            filtered.forEach((s) => {
                const badgeClass = s.status === 'emision' ? 'badge-emision' : 'badge-finalizada';
                const badgeText = s.status === 'emision' ? 'En Emisión' : 'Completada';
                const bgStyle = s.poster ? `background-image: url('${s.poster}')` : `background: #152238`;

                grid.innerHTML += `
                    <div class="card" onclick="openSeries('${s.id}')">
                        <div class="card-img-container" style="${bgStyle}">
                            <span class="badge ${badgeClass}">${badgeText}</span>
                        </div>
                        <div class="card-info">
                            <div class="card-title">${s.title}</div>
                            <div class="card-subtitle">${s.episodes} Cap. disponibles</div>
                        </div>
                    </div>
                `;
            });
        }

        function setCategory(cat, element) {
            currentCategory = cat;
            document.querySelectorAll('.category-tab').forEach(t => t.classList.remove('active'));
            element.classList.add('active');

            const grid = document.getElementById('series-grid');
            const searchBox = document.getElementById('search-box-container');
            const fanZone = document.getElementById('fanzone-container');

            if (cat === 'fanzone') {
                grid.style.display = 'none';
                searchBox.style.display = 'none';
                fanZone.style.display = 'block';
                renderFanZoneContent();
            } else {
                grid.style.display = 'grid';
                searchBox.style.display = 'block';
                fanZone.style.display = 'none';
                renderSeries();
            }
        }

        /* Zona Fan Mantenida con Opciones Oficiales */
        function renderFanZoneContent() {
            const container = document.getElementById('fanzone-content');
            
            container.innerHTML = `
                <div class="fan-zone-title">⭐ ENCUESTA DE LA SEMANA</div>
                <div class="fan-zone-subtitle">¿Cuál es tu pareja favorita de "Güneşin Doğduğu Yer"?</div>
                
                <div class="poll-option" onclick="voteOption(this, 'Ömer & Leyla')">
                    <span>Ömer & Leyla</span>
                    <span style="font-size:0.9rem; color:#fbbf24; font-weight:900;">Votar ➔</span>
                </div>
                
                <div class="poll-option" onclick="voteOption(this, 'Kaan & Aslı')">
                    <span>Kaan & Aslı</span>
                    <span style="font-size:0.9rem; color:#fbbf24; font-weight:900;">Votar ➔</span>
                </div>
                
                <div style="margin-top: 18px; text-align: center; color: #fbbf24; font-size: 0.85rem; font-weight:700;">
                    ✨ Apoya a tu pareja favorita en la comunidad oficial de PasiónTurca.
                </div>
            `;
        }

        function voteOption(element, pairName) {
            const parent = element.parentElement;
            parent.querySelectorAll('.poll-option').forEach(opt => {
                opt.classList.remove('selected');
                opt.style.pointerEvents = 'none';
            });
            element.classList.add('selected');
            
            const msg = document.createElement('div');
            msg.style.cssText = "margin-top: 15px; text-align: center; color: #34d399; font-weight: 900; font-size: 1rem;";
            msg.innerText = `✅ ¡Voto registrado por ${pairName} con éxito!`;
            parent.appendChild(msg);
        }

        function filterSeries() { renderSeries(); }

        function openSeries(id) {
            const serie = seriesData.find(s => s.id === id);
            if (!serie) return;

            document.getElementById('modal-title').innerText = serie.title;
            document.getElementById('modal-subtitle').innerText = `Capítulos disponibles: ${serie.episodes}`;
            
            // Asignar minibanner en el modal
            const bannerBg = document.getElementById('modal-banner-bg');
            if (serie.poster) {
                bannerBg.style.backgroundImage = `url('${serie.poster}')`;
            } else {
                bannerBg.style.backgroundImage = `none`;
                bannerBg.style.backgroundColor = '#1e293b';
            }
            
            const container = document.getElementById('chapters-container');
            container.innerHTML = '';

            for (let i = serie.episodes; i >= 1; i--) {
                const thumbImg = serie.poster ? serie.poster : '';
                container.innerHTML += `
                    <div class="episode-card" onclick="openChapter('${serie.link}', ${i})">
                        <div class="episode-info-container">
                            <div class="episode-thumbnail" style="background-image: url('${thumbImg}')"></div>
                            <div class="episode-texts">
                                <span class="episode-title">Capítulo ${i}</span>
                                <span class="episode-subtitle">Duración: 2h 15min | Calidad: 1080p</span>
                            </div>
                        </div>
                        <div>
                            <span class="ver-now-btn">VER AHORA ➔</span>
                        </div>
                    </div>
                `;
            }

            document.getElementById('modal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('modal').classList.remove('active');
            document.getElementById('ad-container').style.display = 'none';
        }

        function openAddModal() { document.getElementById('add-modal').classList.add('active'); }
        function closeAddModal() { document.getElementById('add-modal').classList.remove('active'); }

        function addNewSeries() {
            const title = document.getElementById('new-title').value.trim();
            const status = document.getElementById('new-status').value;
            const episodes = parseInt(document.getElementById('new-episodes').value) || 1;
            const link = document.getElementById('new-link').value.trim() || 'https://t.me/';
            const poster = document.getElementById('new-poster').value.trim();

            if (!title) {
                alert('Por favor, ingresa el título de la serie.');
                return;
            }

            const newId = 'serie_' + Date.now();
            seriesData.unshift({ id: newId, title, status, episodes, link, poster });

            renderSeries();
            closeAddModal();

            document.getElementById('new-title').value = '';
            document.getElementById('new-episodes').value = '1';
            document.getElementById('new-link').value = '';
            document.getElementById('new-poster').value = '';
        }

        function redirectToChapter(channelLink) {
            if (tg && tg.openTelegramLink) {
                tg.openTelegramLink(channelLink);
            } else {
                window.open(channelLink, '_blank');
            }
        }

        function openChapter(channelLink, episode) {
            const adContainer = document.getElementById('ad-container');
            adContainer.style.display = 'block';

            if (AdController) {
                AdController.show().then((result) => {
                    adContainer.style.display = 'none';
                    redirectToChapter(channelLink);
                }).catch((result) => {
                    adContainer.style.display = 'none';
                    redirectToChapter(channelLink);
                });
            } else {
                setTimeout(() => {
                    adContainer.style.display = 'none';
                    redirectToChapter(channelLink);
                }, 1000);
            }
        }

        renderSeries();
    </script>
</body>
</html>
